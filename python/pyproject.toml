[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombokratelimit"
version = "0.1.0"
description = "Deterministic rate limiting with the Generic Cell Rate Algorithm: per-key limiter, burst, variable cost, and retry-after hints; time is passed in explicitly. Part of the Lombok Ecosystem."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lombokratelimit"]
